name: Checks

on:
  push:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Prepare build references
        run: |
          $env:VALHEIM_QA_ROOT = Join-Path $env:RUNNER_TEMP 'boombox-qa'
          New-Item -ItemType Directory -Path $env:VALHEIM_QA_ROOT -Force | Out-Null
          "VALHEIM_QA_ROOT=$env:VALHEIM_QA_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./tools/release/bootstrap-hosted.ps1
      - name: Build plugin and validate translations
        run: |
          $settings = Get-Content -Raw release.local.json | ConvertFrom-Json
          ./build.ps1 -GameManaged $settings.GameManaged -BepInExCore $settings.BepInExCore -OutputDirectory outputs/ci/build -DllOnly
      - name: Run offline product checks
        run: |
          $settings = Get-Content -Raw release.local.json | ConvertFrom-Json
          ./test.ps1 -GameManaged $settings.GameManaged -BepInExCore $settings.BepInExCore -ProductDll outputs/ci/build/ValheimBoombox.dll -OutputDirectory outputs/ci/tests
      - name: Check translation synchronization
        run: ./tests/offline/TranslationSyncChecks.ps1
      - name: Check release infrastructure without publishing
        run: |
          ./tests/offline/github-publication-check.ps1
          ./tests/offline/release-receipt-check.ps1
      - name: Retain checked DLL and test results
        uses: actions/upload-artifact@v4
        with:
          name: checked-dll-${{ github.sha }}
          path: |
            outputs/ci/build/ValheimBoombox.dll
            outputs/ci/tests/results.json
          if-no-files-found: error
          retention-days: 14
